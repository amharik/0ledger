[package]
name = "zero_ledger"
version = "0.1.0"
description = "Local-first double-entry ledger for Indian businesses"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
zeroledger-engine = { path = "../crates/engine" }
zeroledger-storage = { path = "../crates/storage" }
zeroledger-sync = { path = "../crates/sync" }
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
walkdir = "2.5"
sha2 = "0.10"
base64 = "0.22"
lopdf = "0.45"
pdf-inspector = "1.27"
docling = { version = "=2.86.14", default-features = false, features = ["pdf"] }
imap = "2.4"
native-tls = "0.2"
chrono = "0.4"
keyring = "4.2.0"
