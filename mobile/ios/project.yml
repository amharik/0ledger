name: ZeroLedgerMobile
options:
  bundleIdPrefix: com.zerowork
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
targets:
  ZeroLedgerMobile:
    type: application
    platform: iOS
    sources:
      - path: ZeroLedgerMobile
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerowork.zeroledger
        INFOPLIST_FILE: ZeroLedgerMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: ZeroLedgerMobile/ZeroLedgerMobile-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Generated"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../target/aarch64-apple-ios/release"
          - "$(SRCROOT)/../target/aarch64-apple-ios-sim/release"
        OTHER_LDFLAGS:
          - "-lzeroledger_ffi"
